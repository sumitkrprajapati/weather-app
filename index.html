<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="weather-container">
        <h1>🌤️ Weather App</h1>
        <p class="subtitle">Check the weather in your city</p>

        <div class="search-box">
            <input
                type="text"
                id="city-input"
                placeholder="Enter city name..."
            >
            <button id="search-btn">Search</button>
        </div>

        <p id="message"></p>

        <div id="weather-info" class="weather-info">
            <h2 id="city-name">Your City</h2>
            <div id="weather-icon">🌤️</div>
            <h3 id="temperature">--°C</h3>
            <div class="unit-toggle">
    <button id="celsius-btn" class="active">°C</button>
    <button id="fahrenheit-btn">°F</button>
</div>
            <p id="description">Weather condition</p>

            <div class="details">
    <div class="detail-box">
        <span>💧 Humidity</span>
        <strong id="humidity">--%</strong>
    </div>

    <div class="detail-box">
        <span>💨 Wind Speed</span>
        <strong id="wind-speed">-- km/h</strong>
    </div>

    <div class="detail-box">
        <span>🌡️ Feels Like</span>
        <strong id="feels-like">--°C</strong>
    </div>

    <div class="detail-box">
        <span>🧭 Pressure</span>
        <strong id="pressure">-- hPa</strong>
    </div>

    <div class="detail-box">
        <span>🌅 Sunrise</span>
        <strong id="sunrise">--:--</strong>
    </div>

    <div class="detail-box">
        <span>🌇 Sunset</span>
        <strong id="sunset">--:--</strong>
    </div>
</div>


    <script src="script.js"></script>
</body>
</html>
